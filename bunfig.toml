[install]
# Use exact versions for reproducibility
exact = true
# Only install package versions published at least 3 days ago (supply chain protection)
minimumReleaseAge = 259200

[test]
# Test configuration
coverage = true

[define]
"process.env.HOWCANI_JWT_SECRET" = "'dev-jwt-secret'"

[serve.static]
plugins = ["bun-plugin-svelte"]
