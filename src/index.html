<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HowCanI</title>
    <link rel="shortcut icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Default for first paint; applyTheme() in theme.svelte.ts updates this to match the in-app toggle -->
    <meta name="theme-color" content="#ffffff" />
    <link rel="stylesheet" href="./styles/main.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        var t = localStorage.getItem("howcani_theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        var m = document.createElement("link");
        m.rel = "manifest";
        m.href = "/app.webmanifest";
        document.head.appendChild(m);
      })();
    </script>
    <style>
      :root {
        --background: 150 10% 95%;
        --foreground: 200 15% 15%;
        --primary: 168 35% 38%;
        --primary-foreground: 0 0% 100%;
        --secondary: 150 12% 90%;
        --secondary-foreground: 200 15% 15%;
        --muted: 150 8% 90%;
        --muted-foreground: 200 6% 45%;
        --card: 0 0% 100%;
        --card-foreground: 200 15% 15%;
        --accent: 168 35% 38%;
        --accent-foreground: 0 0% 100%;
        --border: 150 10% 84%;
        --input: 150 10% 84%;
        --ring: 168 35% 38%;
        --sidebar: 0 0% 100%;
        --sidebar-foreground: 200 15% 15%;
      }
      .dark {
        --background: 200 15% 10%;
        --foreground: 150 10% 88%;
        --primary: 168 40% 50%;
        --primary-foreground: 200 15% 8%;
        --secondary: 200 12% 16%;
        --secondary-foreground: 150 10% 88%;
        --muted: 200 10% 16%;
        --muted-foreground: 150 6% 55%;
        --card: 200 14% 13%;
        --card-foreground: 150 10% 88%;
        --accent: 168 40% 50%;
        --accent-foreground: 200 15% 8%;
        --border: 200 10% 20%;
        --input: 200 10% 20%;
        --ring: 168 40% 50%;
        --sidebar: 200 14% 12%;
        --sidebar-foreground: 150 10% 88%;
      }
      body {
        font-family: 'IBM Plex Sans', ui-sans-serif, sans-serif;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
      }

      /* Markdown content styles */
      .prose h1, .prose h2, .prose h3, .prose h4 {
        font-family: 'IBM Plex Sans', sans-serif;
        font-weight: 600;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
      }
      .prose h1 { font-size: 1.5rem; }
      .prose h2 { font-size: 1.25rem; }
      .prose h3 { font-size: 1.1rem; }
      .prose p { margin-bottom: 0.75em; line-height: 1.7; }
      .prose ul, .prose ol { margin-bottom: 0.75em; padding-left: 1.5em; }
      .prose li { margin-bottom: 0.25em; line-height: 1.6; }
      .prose ul { list-style-type: disc; }
      .prose ol { list-style-type: decimal; }
      .prose code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
        padding: 0.15em 0.35em;
        border-radius: 3px;
        background: hsl(var(--muted));
      }
      .prose pre {
        margin-bottom: 1em;
        padding: 1em;
        border-radius: 6px;
        overflow-x: auto;
        background: hsl(200 15% 10%);
        color: hsl(150 10% 88%);
      }
      .prose pre code {
        background: none;
        padding: 0;
        font-size: 0.85em;
        color: inherit;
      }
      .prose a {
        color: hsl(var(--primary));
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .prose a:hover { opacity: 0.8; }
      .prose blockquote {
        border-left: 3px solid hsl(var(--border));
        padding-left: 1em;
        margin-bottom: 0.75em;
        color: hsl(var(--muted-foreground));
        font-style: italic;
      }
      .prose strong { font-weight: 600; }
      .prose hr {
        border: none;
        border-top: 1px solid hsl(var(--border));
        margin: 1.5em 0;
      }

      /* Skeleton loading animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, hsl(var(--muted)) 25%, hsl(var(--muted-foreground) / 0.08) 50%, hsl(var(--muted)) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 4px;
      }

      /* Fade-in animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out both;
      }

      /* Dialog open/close animation */
      dialog[open] {
        transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                    display 0.3s allow-discrete;
        opacity: 1;
        transform: scale(1) translateY(0);
      }
      @starting-style {
        dialog[open] {
          opacity: 0;
          transform: scale(0.88) translateY(-20px);
        }
      }

      /* Theme toggle: radial reveal from the top-right where the button lives */
      ::view-transition-new(root) {
        animation: 500ms ease-in-out both theme-reveal-in;
      }
      ::view-transition-old(root) {
        animation: 400ms ease-in-out both theme-reveal-out;
      }
      @keyframes theme-reveal-in {
        from { clip-path: circle(0% at 93% 2%); }
        to   { clip-path: circle(150% at 93% 2%); }
      }
      @keyframes theme-reveal-out {
        from { clip-path: circle(150% at 93% 2%); }
        to   { clip-path: circle(0% at 93% 2%); }
      }

      /* Code preview in cards */
      .code-preview {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        line-height: 1.5;
        background: hsl(var(--muted));
        color: hsl(var(--foreground));
        padding: 0.75rem;
        border-radius: 6px;
        overflow: hidden;
        white-space: pre;
        max-height: 5rem;
        border: 1px solid hsl(var(--border));
      }

      /* Scrollbar styling for tag sidebar */
      .sidebar-scroll::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .sidebar-scroll::-webkit-scrollbar-thumb {
        background: hsl(var(--border));
        border-radius: 2px;
      }

      /* Hide scrollbar for horizontal tag scroll on mobile */
      .tags-scroll {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .tags-scroll::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./client/main.ts"></script>
  </body>
</html>
