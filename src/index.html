<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HowCanI</title>
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
              serif: ['"Source Serif 4"', 'Georgia', 'serif'],
            },
            colors: {
              background: "hsl(var(--background))",
              foreground: "hsl(var(--foreground))",
              primary: { DEFAULT: "hsl(var(--primary))", foreground: "hsl(var(--primary-foreground))" },
              secondary: { DEFAULT: "hsl(var(--secondary))", foreground: "hsl(var(--secondary-foreground))" },
              muted: { DEFAULT: "hsl(var(--muted))", foreground: "hsl(var(--muted-foreground))" },
              card: { DEFAULT: "hsl(var(--card))", foreground: "hsl(var(--card-foreground))" },
              accent: { DEFAULT: "hsl(var(--accent))", foreground: "hsl(var(--accent-foreground))" },
              border: "hsl(var(--border))",
              input: "hsl(var(--input))",
              ring: "hsl(var(--ring))",
            },
          },
        },
      };
    </script>
    <style>
      :root {
        --background: 40 33% 98%;
        --foreground: 20 20% 14%;
        --primary: 152 28% 32%;
        --primary-foreground: 40 33% 98%;
        --secondary: 40 20% 93%;
        --secondary-foreground: 20 20% 14%;
        --muted: 40 14% 92%;
        --muted-foreground: 20 8% 46%;
        --card: 40 33% 99%;
        --card-foreground: 20 20% 14%;
        --accent: 152 28% 32%;
        --accent-foreground: 40 33% 98%;
        --border: 30 14% 86%;
        --input: 30 14% 86%;
        --ring: 152 28% 32%;
      }
      .dark {
        --background: 20 14% 10%;
        --foreground: 40 14% 88%;
        --primary: 152 30% 48%;
        --primary-foreground: 20 14% 10%;
        --secondary: 20 10% 16%;
        --secondary-foreground: 40 14% 88%;
        --muted: 20 10% 16%;
        --muted-foreground: 30 8% 56%;
        --card: 20 14% 12%;
        --card-foreground: 40 14% 88%;
        --accent: 152 30% 48%;
        --accent-foreground: 20 14% 10%;
        --border: 20 10% 20%;
        --input: 20 10% 20%;
        --ring: 152 30% 48%;
      }
      body {
        font-family: 'Source Serif 4', Georgia, serif;
      }

      /* Markdown content styles */
      .prose h1, .prose h2, .prose h3, .prose h4 {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 600;
        margin-top: 1.5em;
        margin-bottom: 0.5em;
      }
      .prose h1 { font-size: 1.5rem; }
      .prose h2 { font-size: 1.25rem; }
      .prose h3 { font-size: 1.1rem; }
      .prose p { margin-bottom: 0.75em; line-height: 1.7; }
      .prose ul, .prose ol { margin-bottom: 0.75em; padding-left: 1.5em; }
      .prose li { margin-bottom: 0.25em; line-height: 1.6; }
      .prose ul { list-style-type: disc; }
      .prose ol { list-style-type: decimal; }
      .prose code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.85em;
        padding: 0.15em 0.35em;
        border-radius: 3px;
        background: hsl(var(--muted));
      }
      .prose pre {
        margin-bottom: 1em;
        padding: 1em;
        border-radius: 6px;
        overflow-x: auto;
        background: hsl(20 14% 10%);
        color: hsl(40 14% 88%);
      }
      .prose pre code {
        background: none;
        padding: 0;
        font-size: 0.85em;
        color: inherit;
      }
      .prose a {
        color: hsl(var(--primary));
        text-decoration: underline;
        text-underline-offset: 2px;
      }
      .prose a:hover { opacity: 0.8; }
      .prose blockquote {
        border-left: 3px solid hsl(var(--border));
        padding-left: 1em;
        margin-bottom: 0.75em;
        color: hsl(var(--muted-foreground));
        font-style: italic;
      }
      .prose strong { font-weight: 600; }
      .prose hr {
        border: none;
        border-top: 1px solid hsl(var(--border));
        margin: 1.5em 0;
      }

      /* Skeleton loading animation */
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton {
        background: linear-gradient(90deg, hsl(var(--muted)) 25%, hsl(var(--muted-foreground) / 0.08) 50%, hsl(var(--muted)) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s ease-in-out infinite;
        border-radius: 4px;
      }

      /* Fade-in animation */
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in {
        animation: fadeIn 0.3s ease-out both;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./client/main.ts"></script>
  </body>
</html>
