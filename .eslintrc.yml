root: true

extends:
  - "eslint:recommended"

parserOptions:
  ecmaVersion: 13
  sourceType: "module"

env:
  jest: true
  es6: true
  browser: true

rules:
  quotes:
    - 1
    - single
  semi:
    - 1
    - always

plugins:
  - svelte3
  - json-light

overrides:
  - files: ['*.svelte']
    parser: "svelte/svelte3"

globals:
  localStorage: false
  IntersectionObserver: false
  $state: false
  $effect: false
