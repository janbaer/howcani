---
services:
  howcani:
    image: forgejo.home.janbaer.de/jan/howcani:latest
    container_name: howcani
    env_file: .env
    environment:
      DATABASE_URL: /data/howcani.db
      BACKUP_DIR: /data/backups
      HOWCANI_CONFIG_PATH: /data/config.yaml
      TZ: Europe/Berlin
    user: 1000:1000
    volumes:
      - ./data:/data
      # IMPORTANT: copy config.example.yaml to ./config.yaml BEFORE `docker compose up`.
      # If ./config.yaml does not exist, Docker creates it as an empty *directory*
      # for this bind mount, and the server fails to read it instead of giving the
      # clear "Configuration file not found" message.
      - ./config.yaml:/data/config.yaml:ro
    ports:
      - 3000:3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:' + (process.env.PORT || 3000) + '/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
